<div class="form-container">
    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="brand">
                    <div class="brand__logo" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed"><path d="M180-475q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29Zm180-160q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29Zm240 0q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29Zm180 160q-42 0-71-29t-29-71q0-42 29-71t71-29q42 0 71 29t29 71q0 42-29 71t-71 29ZM266-75q-45 0-75.5-34.5T160-191q0-52 35.5-91t70.5-77q29-31 50-67.5t50-68.5q22-26 51-43t63-17q34 0 63 16t51 42q28 32 49.5 69t50.5 69q35 38 70.5 77t35.5 91q0 47-30.5 81.5T694-75q-54 0-107-9t-107-9q-54 0-107 9t-107 9Z"/></svg>
                    </div>
                    <div class="brand__text">
                        <h1>PetShop - Cadastro</h1>
                    </div>
                </div>
            </div>

            <div class="card-body">
                <form [formGroup]="userRegisterForm" (submit)="register()">
                    <mat-form-field appearance="outline">
                        <mat-label>Nome Completo</mat-label>
                        <input matInput placeholder="Placeholder" formControlName="name">
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>CPF</mat-label>
                        <input matInput placeholder="Placeholder" formControlName="cpf">
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>Telefone</mat-label>
                        <input matInput placeholder="Placeholder" formControlName="phone">
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>Email</mat-label>
                        <input matInput placeholder="Placeholder" formControlName="email">
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>Endereço Completo</mat-label>
                        <input matInput placeholder="Placeholder" formControlName="address">
                    </mat-form-field>
                    <mat-form-field appearance="outline"
                    *ngIf="isAdmin"
                    >
                        <mat-label>CRM-V</mat-label>
                        <input matInput placeholder="Placeholder" formControlName="crmv">
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>Cargo</mat-label>
                        <select matNativeControl required formControlName="role">
                            <option value="0" selected disabled >Selecione um cargo</option>
                            <option value="USER">Cliente</option>
                            <option value="VETERINARIAN">Veterinário</option>
                            <option value="ADMIN">Gerente</option>
                        </select>
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>Senha</mat-label>
                        <input matInput placeholder="Placeholder" formControlName="password">
                    </mat-form-field>
                    <ps-btn-primary [textBtn]="'OK'" [typeBtn]="'submit'">
                        
                    </ps-btn-primary>
                </form>
            </div>

            <div class="card-footer">
                <span>Não tem conta? <a href="#">Registre-se</a></span>
            </div>
        </div>
    </div>
</div>
